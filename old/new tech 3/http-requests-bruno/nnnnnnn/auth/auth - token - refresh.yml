info:
  name: auth - token - refresh
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/refresh-token"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();
        bru.setEnvVar("access_token", body.token);
        bru.setEnvVar("user-id", body.payload.id);
        bru.setEnvVar("user-roles", body.payload.roles);
        bru.setEnvVar("username", body.payload.username);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
