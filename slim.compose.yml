name: mestrado-slim

services:

  # --------------------------------------------------------------------------------------
  # --- BUN + WHISPERX DEV                                                              ---
  # --------------------------------------------------------------------------------------

  app:
    container_name: bun-app
    build:
      context: .
      dockerfile: slim.containerfile
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app:Z,U
      - ./.data/videos:/videos:Z,U
    ports:
      - "3000:3000"
    command:
      sleep infinity

  # --------------------------------------------------------------------------------------
  # --- Postgres                                                                       ---
  # --------------------------------------------------------------------------------------

  postgres:
    container_name: 
      postgres
    image: 
      docker.io/postgres:latest
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./.data/postgres_data:/var/lib/postgresql:Z,U

  # --------------------------------------------------------------------------------------
  # --- ADMINER                                                                        ---
  # --------------------------------------------------------------------------------------

  adminer:    
    image: docker.io/adminer:latest
    container_name: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "5050:8080"
    depends_on:
      - postgres
    volumes:
      - ./.data/adminer_data:/var/lib/adminer:Z,U

  # --------------------------------------------------------------------------------------
  # --- ELASTIC SEARCH                                                                 ---
  # --------------------------------------------------------------------------------------

  elasticsearch:
    image: docker.io/elasticsearch:9.1.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - ./.data/elasticsearch:/usr/share/elasticsearch/data:Z,U


  # --------------------------------------------------------------------------------------
  # --- LiteLLM                                                                       ---
  # --------------------------------------------------------------------------------------

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    command:
      - "--config"
      - "/app/config.yaml"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:Z
    ports:
      - "4000:4000"
    depends_on:
      - ollama

  # --------------------------------------------------------------------------------------
  # --- OLLAMA                                                                        ---
  # --------------------------------------------------------------------------------------

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./.data/ollama:/root/.ollama:Z,U
    restart: unless-stopped